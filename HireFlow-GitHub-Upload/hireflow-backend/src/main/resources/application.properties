# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hireflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Explicitly use the same credentials for Flyway
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/hireflow_db}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD}

# Database schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
